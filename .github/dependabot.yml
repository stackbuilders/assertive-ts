version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(all)"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-dev-dependencies:
        applies-to: version-updates
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(all)"
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
